name: Manga Update Monitor

on:
  schedule:
    # Run every 6 hours: 00:00, 06:00, 12:00, 18:00 (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual trigger

# Prevent multiple simultaneous runs
concurrency:
  group: manga-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run manga monitor
      env:
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      run: |
        python -m src.main

    - name: Commit and push if state changed
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        if [[ -n $(git status --porcelain data/state.json) ]]; then
          echo "State file changed, committing..."
          git add data/state.json
          git commit -m "Update manga state [skip ci]"
          git push
        else
          echo "No changes to state file"
        fi
      continue-on-error: true